id = "ci-gate-fix"
level = "medium"
workspace = "tiny-py-gate"
project = "demo"
prompt = "ci is red, the gate fails. fix it, dont touch the tests"

[[check]]
kind = "command_exit"
command = "./gate.sh"

[[check]]
kind = "files_unchanged"
path = ["test_fetch.py", "gate.sh", "ruff.toml"]

[[check]]
kind = "max_time"
seconds = 240
