id = "rule-edit-small"
level = "light"
workspace = "rule-no-yap"
project = "demo"
prompt = "clarify the wording in rules/no-yap.md, keep it short"

[[check]]
kind = "files_changed"
path = "rules/no-yap.md"

[[check]]
kind = "byte_size"
path = "rules/no-yap.md"

[[check]]
kind = "file_regex"
path = "rules/no-yap.md"
regex = "MUST[^\\n]*(few|short|brief|concise)"

[[check]]
kind = "file_regex"
path = "rules/no-yap.md"
regex = "MUST NOT[^\\n]*(restate|repeat|echo|parrot)[^\\n]*question"

[[check]]
kind = "file_regex"
path = "rules/no-yap.md"
regex = "MUST NOT[^\\n]*(narrate|announce|describe)[^\\n]*(about to|going to)"

[[check]]
kind = "file_regex"
path = "rules/no-yap.md"
regex = "MUST NOT[^\\n]*explain[^\\n]*(see|obvious|already)"

[[check]]
kind = "file_regex"
path = "rules/no-yap.md"
regex = "MAY[^\\n]*(longer|detail|expand)"

[[check]]
kind = "file_regex"
path = "rules/no-yap.md"
regex = "MUST[^\\n]*(end|report|finish)[^\\n]*result"

[[check]]
kind = "judge"
path = "rules/no-yap.md"
rubric = "The evidence is the rule file after the user asked to clarify its wording and keep it short. PASS only if the wording is clearer than a plain reading of the original bullets would give (vague phrases such as 'parrot the question back' or 'as few words as carry the meaning' now say plainly what to do or avoid), the rule is not longer in substance, and it still states every one of these directives: answer in few words, do not repeat the question, do not narrate what you are about to do, do not explain what the reader can already see, go longer only when the user asks for detail, end a report with the result and not a recap. FAIL if a directive is dropped, weakened (a MUST turned into a SHOULD or a MAY), merged so it no longer reads as its own instruction, or if the edit adds new rules, examples or commentary."
