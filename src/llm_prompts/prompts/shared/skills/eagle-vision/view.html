<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Plan view</title>
<style>
* { box-sizing: border-box; }
:root {
  --bg: #060b14; --ink: #dfeaf5; --muted: #7f95ad; --cyan: #5ff3ff;
  --line: rgba(95, 243, 255, 0.3); --faint: rgba(95, 243, 255, 0.12);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
}
body {
  margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--ink);
  font: 12px/1.4 var(--mono); letter-spacing: 0.02em;
  background:
    linear-gradient(var(--faint) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, var(--faint) 1px, transparent 1px) 0 0 / 32px 32px,
    radial-gradient(ellipse at 50% 0%, rgba(40, 90, 140, 0.4), transparent 65%),
    var(--bg);
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background:
    repeating-linear-gradient(rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.45));
}
body::before {
  content: ""; position: fixed; left: 0; right: 0; top: 0; height: 140px; pointer-events: none; z-index: 49;
  background: linear-gradient(transparent, rgba(95, 243, 255, 0.03), transparent);
  animation: sweep 30s linear infinite; will-change: transform;
}
#hud {
  --c: rgba(95, 243, 255, 0.75);
  position: fixed; inset: 6px; pointer-events: none; z-index: 60;
  background:
    linear-gradient(var(--c), var(--c)) 0 0 / 22px 2px no-repeat, linear-gradient(var(--c), var(--c)) 0 0 / 2px 22px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0 / 22px 2px no-repeat, linear-gradient(var(--c), var(--c)) 100% 0 / 2px 22px no-repeat,
    linear-gradient(var(--c), var(--c)) 0 100% / 22px 2px no-repeat, linear-gradient(var(--c), var(--c)) 0 100% / 2px 22px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 22px 2px no-repeat, linear-gradient(var(--c), var(--c)) 100% 100% / 2px 22px no-repeat;
}
#main { flex: 1; overflow: auto; padding: 18px 22px; min-width: 0; }
#panel {
  width: 380px; flex: none; overflow: auto; padding: 18px 16px; color: #0b1628; background: #e9eff5;
  border-left: 2px solid var(--cyan); box-shadow: -8px 0 28px rgba(95, 243, 255, 0.18);
  animation: slide-in 0.25s ease-out;
}
#panel[hidden] { display: none; }
body:has(#panel:not([hidden])) #status { right: 404px; }
h1 {
  display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: bold; margin: 0 0 10px;
  text-transform: uppercase; letter-spacing: 0.22em; color: #fff; text-shadow: 0 0 10px var(--cyan);
}
h1::before { content: ""; width: 10px; height: 10px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); clip-path: polygon(0 0, 100% 0, 100% 60%, 60% 100%, 0 100%); }
h1::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
#status { position: fixed; top: 14px; right: 24px; z-index: 60; font-weight: normal; font-size: 11px; letter-spacing: 0.12em; color: var(--cyan); text-shadow: none; }
#status::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; animation: pulse 2s ease-in-out infinite; }
#status.lost { color: #ff5d6c; }
#legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-bottom: 14px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
#legend .item { display: flex; align-items: center; gap: 5px; }
#legend input { accent-color: var(--cyan); margin: 0; }
#legend label { cursor: pointer; }
#grid { display: grid; gap: 5px; width: max-content; }
#grid.glitch { animation: glitch 0.45s steps(1, end); }
.hdr, .repo {
  --cut: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.14em; color: var(--cyan); background: #0a1628;
  box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
}
.hdr { text-align: center; padding: 5px; }
.repo { padding: 6px 10px; position: sticky; left: 0; z-index: 2; display: flex; align-items: center; overflow-wrap: break-word; }
.cell {
  --bc: rgba(95, 243, 255, 0.55);
  display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-height: 44px; padding: 7px;
  border: 1px solid var(--faint);
  background:
    linear-gradient(var(--bc), var(--bc)) 0 0 / 9px 1px no-repeat, linear-gradient(var(--bc), var(--bc)) 0 0 / 1px 9px no-repeat,
    linear-gradient(var(--bc), var(--bc)) 100% 0 / 9px 1px no-repeat, linear-gradient(var(--bc), var(--bc)) 100% 0 / 1px 9px no-repeat,
    linear-gradient(var(--bc), var(--bc)) 0 100% / 9px 1px no-repeat, linear-gradient(var(--bc), var(--bc)) 0 100% / 1px 9px no-repeat,
    linear-gradient(var(--bc), var(--bc)) 100% 100% / 9px 1px no-repeat, linear-gradient(var(--bc), var(--bc)) 100% 100% / 1px 9px no-repeat,
    rgba(8, 17, 32, 0.72);
}
.box {
  --k: #dfeaf5; --cut: 8px; --bw: 2px; --frame: color-mix(in srgb, var(--k) 55%, transparent); --glow: transparent;
  position: relative; isolation: isolate; width: 152px; padding: 5px 8px 5px 12px; cursor: pointer;
  font-size: 11px; overflow-wrap: anywhere; color: #eef6fc; background: var(--frame);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  transition: opacity 0.2s, filter 0.15s;
}
.box::before {
  content: ""; position: absolute; inset: var(--bw); z-index: -1;
  background: linear-gradient(var(--k), var(--k)) 0 0 / 4px 100% no-repeat, color-mix(in srgb, var(--k) 20%, #0a1322);
  box-shadow: inset 0 0 12px var(--glow);
  clip-path: polygon(calc(var(--cut) - 2px) 0, 100% 0, 100% calc(100% - var(--cut) + 2px), calc(100% - var(--cut) + 2px) 100%, 0 100%, 0 calc(var(--cut) - 2px));
}
.box:hover { filter: brightness(1.3); }
.box.fix { --k: #ff5d6c; } .box.rec { --k: #4aa8ff; } .box.sec { --k: #b57bff; }
.box.onc { --k: #ffc247; } .box.cor { --k: #3fe0b0; } .box.interface { --k: #9aa7b4; }
.box.sel { --bw: 3px; --frame: #fff; --glow: rgba(255, 255, 255, 0.55); }
.box.dep { --bw: 3px; --frame: #39ff88; --glow: rgba(57, 255, 136, 0.6); }
.box.dnt { --bw: 3px; --frame: #ff4fb0; --glow: rgba(255, 79, 176, 0.6); }
.dim { opacity: 0.5; filter: saturate(0.6); }
#legend .box { --cut: 4px; width: 20px; height: 12px; padding: 0; cursor: default; }
#legend .box:hover { filter: none; }
.mark {
  float: right; margin: 0 0 2px 4px; padding: 2px 4px; font-size: 9px; line-height: 1; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); border: 1px solid var(--muted); background: rgba(6, 11, 20, 0.7);
}
.mark.done { color: #04121a; background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 6px rgba(95, 243, 255, 0.6); }
.mark.testing { color: #1a1200; background: #ffd23f; border-color: #ffd23f; animation: pulse 1.8s ease-in-out infinite; }
.mark.building { color: #1a0a00; background: #ff8a3d; border-color: #ff8a3d; animation: pulse 1.2s ease-in-out infinite; }
#panel h2 {
  --cut: 8px; font-size: 13px; margin: 0 0 8px; padding: 7px 10px; overflow-wrap: anywhere; color: var(--cyan); background: #0a1628;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
}
#panel h3 { font-size: 11px; margin: 14px 0 4px; padding-bottom: 2px; text-transform: uppercase; letter-spacing: 0.14em; color: #1f5a7a; border-bottom: 1px solid rgba(31, 90, 122, 0.35); }
#panel pre { white-space: pre-wrap; margin: 0; font: 12px/1.4 var(--mono); overflow-wrap: anywhere; }
#panel ul { margin: 0; padding-left: 16px; }
#panel li { overflow-wrap: anywhere; cursor: pointer; }
#panel li:hover { color: #006c8a; text-decoration: underline; }
#panel .meta { color: #3d5266; }
@keyframes sweep { 0% { transform: translateY(-160px); } 25%, 100% { transform: translateY(100vh); } }
@keyframes pulse { 50% { opacity: 0.45; } }
@keyframes slide-in { from { opacity: 0; transform: translateX(24px); } }
@keyframes glitch {
  0% { opacity: 0.15; transform: translateX(-4px); }
  15% { opacity: 1; transform: translateX(5px); }
  30% { opacity: 0.4; transform: translateX(-2px); }
  45% { opacity: 1; transform: translateX(2px); }
  60% { opacity: 0.7; transform: translateX(0); }
  80% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style></head><body>
<div id="hud"></div>
<div id="main">
<h1>Plan view<span id="status"></span></h1>
<div id="legend"></div>
<div id="grid"></div>
</div>
<div id="panel" hidden></div>
<script>
const POLL_MS = 3000;
const CELL_WIDTH = 470;
const KINDS = [["fix", "fix-"], ["rec", "rec-"], ["sec", "sec-"], ["onc", "onc-"], ["cor", "cor-"], ["interface", "interface-*"]];
const STAGE_TEXT = { done: "done", testing: "test", building: "build", todo: "todo" };
const HIGHLIGHTS = [["sel", "selected"], ["dep", "dependency"], ["dnt", "dependent"]];
let data = null, nodes = {}, ids = [], dependents = {}, els = {};
let hovered = null, transitive = true, selected = decodeURIComponent(location.hash.slice(1)) || null, raw = "";

const kindOf = label => { const k = label.split("-")[0]; return KINDS.some(x => x[0] === k) ? k : "other"; };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function buildLegend() {
  const lg = document.getElementById("legend");
  KINDS.forEach(([k, name]) => { const i = el("span", "item"); i.append(el("span", "sw box " + k), el("span", "", name)); lg.append(i); });
  Object.entries(STAGE_TEXT).forEach(([s, text]) => {
    const i = el("span", "item"); i.append(el("span", "mark " + s, text), el("span", "", s)); lg.append(i);
  });
  HIGHLIGHTS.forEach(([cls, name]) => {
    const i = el("span", "item"); i.append(el("span", "sw box other " + cls), el("span", "", name)); lg.append(i);
  });
  const lab = el("label", "item"); const cb = el("input"); cb.type = "checkbox"; cb.checked = true;
  cb.onchange = () => { transitive = cb.checked; refresh(); };
  lab.append(cb, el("span", "", "transitive")); lg.append(lab);
}

function buildGrid() {
  const grid = document.getElementById("grid");
  grid.style.gridTemplateColumns = "fit-content(180px) repeat(" + data.waves + ", fit-content(" + CELL_WIDTH + "px))";
  const cells = [el("div", "hdr")];
  for (let w = 1; w <= data.waves; w++) cells.push(el("div", "hdr", "Wave " + w));
  els = {};
  data.repos.forEach(repo => {
    cells.push(el("div", "repo", repo));
    for (let w = 1; w <= data.waves; w++) {
      const cell = el("div", "cell");
      ids.filter(i => nodes[i].repo === repo && nodes[i].wave === w).forEach(i => {
        const n = nodes[i];
        const box = el("div", "box " + kindOf(n.label));
        box.title = i;
        box.append(el("span", "mark " + n.stage, STAGE_TEXT[n.stage]), document.createTextNode(n.label));
        box.onclick = () => { select(selected === i ? null : i); if (selected) els[i].scrollIntoView({ block: "nearest", inline: "nearest" }); };
        box.onmouseenter = () => { hovered = i; refresh(); };
        box.onmouseleave = () => { hovered = null; refresh(); };
        els[i] = box;
        cell.append(box);
      });
      cells.push(cell);
    }
  });
  grid.replaceChildren(...cells);
  grid.classList.remove("glitch");
  void grid.offsetWidth;
  grid.classList.add("glitch");
}

function select(id) {
  selected = id;
  if (id) location.hash = encodeURIComponent(id);
  else history.replaceState(null, "", location.pathname + location.search);
  refresh();
}

document.addEventListener("click", e => {
  const keep = e.composedPath().some(n => n.id === "panel" || n.id === "legend" || (n.classList && n.classList.contains("box")));
  if (!keep && selected) select(null);
});

function closure(start, edges) {
  const seen = new Set(), queue = [start];
  while (queue.length) {
    edges(queue.pop()).forEach(n => { if (!seen.has(n) && nodes[n]) { seen.add(n); if (transitive) queue.push(n); } });
  }
  return seen;
}

function list(title, items) {
  const frag = document.createDocumentFragment();
  frag.append(el("h3", "", title + " (" + items.length + ")"));
  const ul = el("ul");
  items.forEach(i => {
    const li = el("li", "", i + (nodes[i] ? " [w" + nodes[i].wave + "]" : " [not in plan]"));
    if (nodes[i]) li.onclick = () => select(i);
    ul.append(li);
  });
  if (!items.length) ul.append(el("li", "", "none"));
  frag.append(ul);
  return frag;
}

function refresh() {
  const panel = document.getElementById("panel");
  ids.forEach(i => { els[i].className = "box " + kindOf(nodes[i].label); });
  panel.hidden = !selected || !nodes[selected];
  const focus = nodes[hovered] ? hovered : nodes[selected] ? selected : null;
  if (!focus) return;
  const deps = closure(focus, i => nodes[i].depends);
  const dnts = closure(focus, i => dependents[i]);
  els[focus].title = focus + "\ndepends: " + deps.size + "   dependents: " + dnts.size;
  ids.forEach(i => {
    const c = els[i].classList;
    if (i === focus) c.add("sel");
    else if (deps.has(i)) c.add("dep");
    else if (dnts.has(i)) c.add("dnt");
    else if (focus === selected) c.add("dim");
  });
  if (panel.hidden || focus !== selected) return;
  const n = nodes[selected];
  const mode = transitive ? "transitive" : "direct";
  panel.replaceChildren(el("h2", "", selected), el("div", "meta", "repo: " + n.repo + "   wave: " + n.wave + "   stage: " + n.stage));
  panel.append(list("Depends - " + mode, [...deps]), list("Dependents - " + mode, [...dnts]));
  Object.entries(n.sections).forEach(([name, text]) => { panel.append(el("h3", "", name), el("pre", "", text || "(none)")); });
}

function load(text) {
  data = JSON.parse(text);
  nodes = Object.fromEntries(data.nodes.map(n => [n.id, n]));
  ids = Object.keys(nodes);
  dependents = Object.fromEntries(ids.map(i => [i, []]));
  ids.forEach(i => nodes[i].depends.forEach(d => { if (dependents[d]) dependents[d].push(i); }));
  buildGrid();
  refresh();
}

async function poll() {
  const status = document.getElementById("status");
  try {
    const text = await (await fetch("data.json", { cache: "no-store" })).text();
    if (text !== raw) { raw = text; load(text); }
    status.textContent = "live";
    status.className = "";
  } catch (e) {
    status.textContent = "disconnected";
    status.className = "lost";
  }
}

buildLegend();
poll();
setInterval(poll, POLL_MS);
</script></body></html>
