name: PR automation
description: Sync PR status onto the llm-prompts ecosystem project board, enable squash auto-merge on ready contribute PRs, assign the PR author, apply a breaking label from the PR title or body, label blocked PRs, label PRs with merge conflicts as blocked, apply path-based area labels, report a codeowner-review commit status, and label PRs ready to auto-rebase, and rebase auto-rebase PRs onto the base branch when it moves or when the label is added.
inputs:
  projects-token:
    description: Token for the Project GraphQL status sync and for enabling auto-merge.
    required: true
  github-token:
    description: Token used for labeling the PR and reading repo contents.
    required: true
runs:
  using: composite
  steps:
    - name: Sync project status
      if: |
        inputs.projects-token != '' &&
        ((github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "converted_to_draft", "ready_for_review", "closed"]'), github.event.action)) ||
        (github.event_name == 'pull_request_review' && contains(fromJSON('["submitted", "dismissed"]'), github.event.action)))
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.projects-token }}
        script: |
          const { sync } = require(`${process.env.ACTION_PATH}/sync-project-status.js`)
          await sync({ github, context, core })

    - name: Enable squash auto-merge
      if: |
        github.event_name == 'pull_request_target' &&
        (github.event.action == 'ready_for_review' ||
        (contains(fromJSON('["opened", "reopened"]'), github.event.action) && !github.event.pull_request.draft))
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.projects-token }}
        script: |
          const { enable } = require(`${process.env.ACTION_PATH}/auto-merge.js`)
          await enable({ github, context, core })

    - name: Rebase auto-rebase PRs
      if: github.event_name == 'push'
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.projects-token }}
        script: |
          const { rebase } = require(`${process.env.ACTION_PATH}/rebase-prs.js`)
          await rebase({ github, context, core })

    - name: Assign PR author
      if: |
        github.event_name == 'pull_request_target' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { assign } = require(`${process.env.ACTION_PATH}/assign-author.js`)
          await assign({ github, context, core })

    - name: Label breaking PR
      if: |
        github.event_name == 'pull_request_target' &&
        contains(fromJSON('["opened", "reopened", "edited"]'), github.event.action)
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { label } = require(`${process.env.ACTION_PATH}/label-pr.js`)
          await label({ github, context, core })

    - name: Label blocked PR
      if: |
        (github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "converted_to_draft", "ready_for_review", "synchronize"]'), github.event.action)) ||
        (github.event_name == 'pull_request_review' && github.event.action == 'submitted') ||
        (github.event_name == 'workflow_run' && github.event.action == 'completed')
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { labelBlocked } = require(`${process.env.ACTION_PATH}/label-pr.js`)
          await labelBlocked({ github, context, core })

    - name: Label conflicting PR
      if: github.event_name == 'push' || (github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "synchronize", "edited"]'), github.event.action))
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { labelConflicts } = require(`${process.env.ACTION_PATH}/label-conflicts.js`)
          await labelConflicts({ github, context, core })

    - name: Codeowner review gate
      if: |
        (github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review", "edited"]'), github.event.action)) ||
        (github.event_name == 'pull_request_review' && contains(fromJSON('["submitted", "dismissed"]'), github.event.action))
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { gate } = require(`${process.env.ACTION_PATH}/codeowner-review.js`)
          await gate({ github, context })

    - name: Label auto-rebase PR
      id: label-auto-rebase
      if: |
        (github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review", "edited"]'), github.event.action)) ||
        (github.event_name == 'pull_request_review' && contains(fromJSON('["submitted", "dismissed"]'), github.event.action))
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { labelAutoRebase } = require(`${process.env.ACTION_PATH}/label-pr.js`)
          await labelAutoRebase({ github, context, core })

    - name: Rebase newly labelled PR
      if: steps.label-auto-rebase.outputs.labelled == 'true'
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.projects-token }}
        script: |
          const { rebaseLabelled } = require(`${process.env.ACTION_PATH}/rebase-prs.js`)
          await rebaseLabelled({ github, context, core })

    - name: Label PR by area
      if: ${{ !contains(fromJSON('["push", "workflow_run"]'), github.event_name) }}
      uses: actions/labeler@v7
      with:
        repo-token: ${{ inputs.github-token }}
        sync-labels: true
