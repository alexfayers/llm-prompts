rules:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/llm_prompts/prompts/*/rules/**'
          - 'src/llm_prompts/prompts/*/skills/**'
          - 'src/llm_prompts/prompts/*/workflows/**'
          - 'src/llm_prompts/prompts/*/agents/**'

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/llm_prompts/**/*.py'
          - 'pyproject.toml'
          - 'justfile'
          - 'install.sh'
          - 'uv.lock'
          - '.github/**'

tests:
  - changed-files:
      - any-glob-to-any-file: 'tests/**'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'
