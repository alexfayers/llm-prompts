name: Dependencies

on:
  pull_request_target:
    types: [opened, edited, synchronize, closed, reopened]
  issues:
    types: [closed, reopened]
  workflow_run:
    workflows: [PR review]
    types: [completed]
  workflow_dispatch:
  repository_dispatch:
    types: [dependencies-recheck]

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      issues: write
      statuses: write
      pull-requests: write
    steps:
      - id: ci-bot
        uses: alexfayers/llm-prompts-ci/.github/actions/app-token@main
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          fallback-token: ${{ secrets.PROJECTS_TOKEN }}
          owner: ${{ github.repository_owner }}
      - uses: alexfayers/llm-prompts-ci/.github/actions/check-dependencies@main
        with:
          automation-token: ${{ steps.ci-bot.outputs.token }}
