name: PR template

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_call:

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-template-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - if: github.repository == 'alexfayers/llm-prompts'
        run: node --test .github/scripts/*.test.js
      - uses: alexfayers/llm-prompts/.github/actions/pr-template@main
