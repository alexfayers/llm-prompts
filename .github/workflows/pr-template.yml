name: PR template

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

jobs:
  pr-template-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/scripts/*.test.js
      - uses: ./.github/actions/pr-template
