name: Sync review rules

on:
  push:
    branches: [main]
    paths:
      - .github/instructions/review.instructions.md
      - .github/instructions/prompts.instructions.md
      - .github/instructions/python.instructions.md
      - .github/instructions/typescript.instructions.md
  workflow_dispatch:

concurrency:
  group: sync-review-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo: [cline-hooks, mcp-memory]
    steps:
      - uses: actions/checkout@v7
      - id: releaser
        uses: alexfayers/llm-prompts/.github/actions/app-token@main
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          fallback-token: ${{ secrets.PROJECTS_TOKEN }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.releaser.outputs.token }}
          path: target
      - run: mkdir -p target/.github/instructions
      - run: cp .github/instructions/{review,prompts,python,typescript}.instructions.md target/.github/instructions/
      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.releaser.outputs.token }}
          path: target
          branch: bot/copilot-review-rules
          delete-branch: true
          commit-message: 'chore: sync Copilot review rules from llm-prompts'
          title: 'chore: sync Copilot review rules from llm-prompts'
          body: |
            ## What

            - Copy the Copilot review rules from llm-prompts to `.github/instructions/`.

            ## Why

            - llm-prompts is the one place that edits the rules.
            - Copilot review only sees this repo's own checkout, so the copy has to be committed here.
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
