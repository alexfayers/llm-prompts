name: PR automation

on:
  workflow_call:
    inputs:
      project:
        description: Set to false to skip syncing PR status onto the project board.
        required: false
        type: boolean
        default: true
    secrets:
      CI_BOT_ID:
        required: false
      CI_BOT_PRIVATE_KEY:
        required: false
      PROJECTS_TOKEN:
        required: true

jobs:
  automate:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - id: ci-bot
        uses: alexfayers/llm-prompts/.github/actions/app-token@main
        with:
          app-id: ${{ secrets.CI_BOT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          fallback-token: ${{ secrets.PROJECTS_TOKEN }}
      - uses: alexfayers/llm-prompts/.github/actions/pr-automation@main
        with:
          automation-token: ${{ steps.ci-bot.outputs.token }}
          projects-token: ${{ secrets.PROJECTS_TOKEN }}
          github-token: ${{ github.token }}
          project: ${{ inputs.project }}
