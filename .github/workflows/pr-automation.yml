name: PR automation

on:
  workflow_call:
    secrets:
      PROJECTS_TOKEN:
        required: true

jobs:
  automate:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      pull-requests: write
      statuses: write
    steps:
      - uses: alexfayers/llm-prompts/.github/actions/pr-automation@main
        with:
          projects-token: ${{ secrets.PROJECTS_TOKEN }}
          github-token: ${{ github.token }}
