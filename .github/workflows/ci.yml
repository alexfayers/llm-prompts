name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-just
      - run: uv sync --locked
      - run: just lint-check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-just
      - run: uv sync --locked
      - run: just type-check
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'blocked') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-just
      - run: uv sync --locked
      - run: just test
      - uses: py-cov-action/python-coverage-comment-action@v4.6
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ANNOTATE_MISSING_LINES: true

  test-ts:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'blocked') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-just
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: just test-ts

  pi-pins:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changed
        run: |
          if git diff --quiet HEAD^1 HEAD -- src/llm_prompts/prompts/pi/settings.json .github/scripts/check-pi-pins.js; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - if: steps.changed.outputs.run == 'true'
        run: uv sync --locked
      - if: steps.changed.outputs.run == 'true'
        run: uv run node .github/scripts/check-pi-pins.js

  size-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .size-base
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run llm-prompts size-report --base-root .size-base/src/llm_prompts/prompts > size-report.md
      - run: |
          cat size-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.event.pull_request.number }}" > pr-number
      - uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: |
            size-report.md
            pr-number

  pr-automation-test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'blocked') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-just
      - run: just test-actions

  posthog-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: PostHog/resolve-release@v1
        continue-on-error: true
        timeout-minutes: 5
        with:
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          project-id: 314035
          host: https://eu.posthog.com
