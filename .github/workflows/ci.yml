name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/alexfayers/cline-hooks ../cline-hooks
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      - run: just lint-check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/alexfayers/cline-hooks ../cline-hooks
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      - run: just type-check

  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/alexfayers/cline-hooks ../cline-hooks
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      - run: just test
      - uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ANNOTATE_MISSING_LINES: true

  pr-template-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/scripts/check-pr-template.test.js
      - uses: actions/github-script@v9
        with:
          script: |
            const { check } = require('./.github/scripts/check-pr-template.js')
            await check({ github, context, core })
