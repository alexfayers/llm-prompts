name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/alexfayers/cline-hooks ../cline-hooks
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      - run: just lint-check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/alexfayers/cline-hooks ../cline-hooks
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      - run: just type-check

  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/alexfayers/cline-hooks ../cline-hooks
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      - run: just test
      - uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ANNOTATE_MISSING_LINES: true

  pr-template-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/scripts/*.test.js
      - uses: actions/github-script@v9
        with:
          script: |
            const { check } = require('./.github/scripts/check-pr-template.js')
            await check({ github, context, core })

  size-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .size-base
      - run: git clone --depth 1 https://github.com/alexfayers/cline-hooks ../cline-hooks
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run llm-prompts size-report --base-root .size-base/src/llm_prompts/prompts > size-report.md
      - run: |
          cat size-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.event.pull_request.number }}" > pr-number
      - uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: |
            size-report.md
            pr-number

  pr-automation-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/actions/pr-automation/*.test.js
